name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to publish GitHub Releases

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # pnpm install runs the @electron/rebuild postinstall, building node-pty
      # against the Electron ABI for this OS (ConPTY on Windows).
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm exec electron-vite build

      # On a tag -> build + publish installers to a GitHub Release.
      # Otherwise (manual run) -> build only.
      - name: Package (+ publish on tags)
        run: >-
          pnpm exec electron-builder
          --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # install.sh verifies its download against these, and they let anyone
      # check a manual download too. One file per OS, since each matrix job only
      # sees the artifacts it built itself.
      - name: Publish checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sums="SHA256SUMS-${{ runner.os }}.txt"
          # Hashed with node rather than a shell tool: no single one spans the
          # three runners (macOS has shasum and no sha256sum, Git for Windows
          # the reverse), and setup-node has already put node on all of them.
          # Output is `<hash>  <file>`, the format install.sh parses.
          node -e '
            const fs = require("fs"), crypto = require("crypto")
            for (const file of process.argv.slice(1)) {
              const hash = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex")
              console.log(`${hash}  ${file}`)
            }
          ' Cerberus-* > "$sums"
          cat "$sums"
          gh release upload "$GITHUB_REF_NAME" "$sums" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: cerberus-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-*.txt
          if-no-files-found: ignore

  # electron-builder publishes the installers but leaves the release body empty,
  # and all three matrix jobs write to the same release — so the notes are set
  # once, here, after the last one lands.
  notes:
    needs: dist
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the tag history to compute the previous tag

      - name: Set the release body from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Everything between this version's heading and the next one, with
          # the blank lines around it trimmed but the ones inside it kept.
          section=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found {
              if ($0 ~ /[^[:space:]]/) {
                while (blanks-- > 0) print ""
                blanks = 0
                started = 1
                print
              } else if (started) blanks++
            }
          ' CHANGELOG.md)

          if [ -z "$section" ]; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section — add one before tagging $tag"
            exit 1
          fi

          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)

          {
            printf '%s\n' "$section"
            if [ -n "$prev" ]; then
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$prev" "$tag"
            fi
          } | gh release edit "$tag" --notes-file -
