<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerberus</title>
    <style>
      /* Theme tokens. Default = dark; [data-theme="light"] overrides. applyPref()
         stamps data-theme on <html>. */
      :root,
      :root[data-theme='dark'] {
        --bg: #1a1a1a;
        --panel: #232323;
        --input-bg: #1a1a1a;
        --text: #e0e0e0;
        --muted: #9aa0a0;
        --border: #3a3a3a;
        --header-border: #111;
        --accent: #4a9d7f;
        --accent-text: #0d1512;
        --header-focus: #2b3a34;
        --splitter: #2a2a2a;
        --btn-hover: #3a3a3a;
        --error: #e06c6c;
        --hint: #7a8a80;
        --overlay: rgba(0, 0, 0, 0.5);
        --scroll-thumb: #4a4a4a;
        --scroll-thumb-hover: #5f7d72;
      }
      :root[data-theme='light'] {
        --bg: #f5f5f5;
        --panel: #ececec;
        --input-bg: #ffffff;
        --text: #1a1a1a;
        --muted: #5a5a5a;
        --border: #cccccc;
        --header-border: #d0d0d0;
        --accent: #2f7d63;
        --accent-text: #ffffff;
        --header-focus: #d5e8e0;
        --splitter: #d0d0d0;
        --btn-hover: #dcdcdc;
        --error: #c0392b;
        --hint: #5a7a70;
        --overlay: rgba(0, 0, 0, 0.35);
        --scroll-thumb: #bfbfbf;
        --scroll-thumb-hover: #8fb3a7;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
      }
      /* One scrollbar for the whole app, in the theme's own tones: the platform
         one is a bright slab against a dark panel and it shows up in every list
         (the document dropdown, the viewer, the settings). Styled rather than
         overlaid, so it still reserves its gutter and nothing lands under it.
         Styled only through ::-webkit-*: setting `scrollbar-width` or
         `scrollbar-color` puts Chromium back on its own painter for that
         element and drops the rules below, which is what left the terminals
         (xterm sets neither) looking nothing like the lists. */
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        /* the transparent border is the padding: it keeps the thumb off the
           edge of the gutter without a second element */
        background: var(--scroll-thumb);
        background-clip: padding-box;
        border: 4px solid transparent;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scroll-thumb-hover);
        background-clip: padding-box;
      }
      /* xterm's scrollbar is a div it draws itself, not a native one, so the
         rules above never reach it. Its colours come from the terminal theme
         (themes.ts); the geometry has to be matched here. xterm writes the
         slider's width and offset inline (14px wide, flush against the track),
         so the override needs !important to land the same 6px thumb inside a
         4px gutter the ::-webkit rules give every other scrollbar. */
      .xterm .xterm-scrollable-element > .scrollbar.vertical > .slider {
        width: 6px !important;
        left: 4px !important;
        border-radius: 3px;
      }
      .xterm .xterm-scrollable-element > .scrollbar.horizontal > .slider {
        height: 6px !important;
        top: 4px !important;
        border-radius: 3px;
      }
      /* workspace: tab strip on top, pane viewport below */
      .workspace {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      .tabbar {
        display: flex;
        align-items: center;
        flex: 0 0 34px;
        padding: 0 4px;
        background: var(--panel);
        border-bottom: 1px solid var(--header-border);
        font-family: system-ui, sans-serif;
        user-select: none;
      }
      /* chips scroll horizontally; the actions block never does */
      .tabbar-tabs {
        display: flex;
        align-items: center;
        flex: 1 1 auto;
        gap: 2px;
        min-width: 0;
        overflow-x: auto;
        scroll-behavior: smooth;
        /* The bar is 34px tall — a classic (non-overlay) scrollbar eats a third
           of it and squashes the chips. Scrolling still works: wheel, trackpad,
           and selectTab's scrollIntoView. */
        scrollbar-width: none;
      }
      .tabbar-tabs::-webkit-scrollbar {
        display: none;
      }
      /* With the scrollbar gone, a chip cut off mid-letter is the only sign
         there's more to reach — so fade that edge instead of slicing it. Only
         the side that actually has hidden chips fades; syncTabOverflow sets
         the classes on render and on scroll. */
      .tabbar-tabs.fade-right {
        -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
      }
      .tabbar-tabs.fade-left {
        -webkit-mask-image: linear-gradient(to right, transparent, #000 28px);
      }
      .tabbar-tabs.fade-left.fade-right {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent,
          #000 28px,
          #000 calc(100% - 28px),
          transparent
        );
      }
      .tabbar-actions {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
        gap: 2px;
        padding-left: 6px;
      }
      .tabbar-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-variant-emoji: text;
        line-height: 1;
        cursor: pointer;
      }
      .tabbar-btn:hover {
        background: var(--btn-hover);
        color: var(--text);
      }
      /* Telegram toggle: the plane says which channel, the colour says whether
         it's live. Brand blue = pushing, grey + a cut through the plane = every
         session silenced. Same footprint in both states, so the bar never jumps. */
      .tabbar-telegram {
        color: #26a5e4;
      }
      .tabbar-telegram:hover {
        color: #26a5e4;
      }
      .tabbar-telegram svg {
        width: 15px;
        height: 15px;
        display: block;
      }
      .tabbar-telegram .mute-slash,
      .tabbar-telegram .mute-slash-bg {
        display: none;
        stroke-linecap: round;
      }
      .tabbar-telegram.muted {
        color: var(--muted);
      }
      .tabbar-telegram.muted:hover {
        color: var(--text);
      }
      .tabbar-telegram.muted .mute-slash,
      .tabbar-telegram.muted .mute-slash-bg {
        display: block;
      }
      .tabbar-telegram.muted .mute-slash {
        stroke: currentColor;
        stroke-width: 2;
      }
      /* Painted under the slash in the bar's own colour so the cut reads as a
         gap in the plane. Follows :hover, where the button gets a lighter bg. */
      .tabbar-telegram.muted .mute-slash-bg {
        stroke: var(--panel);
        stroke-width: 4.5;
      }
      .tabbar-telegram.muted:hover .mute-slash-bg {
        stroke: var(--btn-hover);
      }
      /* No token/chat id: nothing to silence. Dimmed and inert, but still there
         with a tooltip pointing at Settings. */
      .tabbar-telegram.unconfigured,
      .tabbar-telegram.unconfigured:hover {
        color: var(--muted);
        opacity: 0.45;
        cursor: default;
        background: transparent;
      }
      .tabs-viewport {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
      }
      .tab-container {
        position: absolute;
        inset: 0;
        /* Keeps the bottom pane's focus frame off the window's own rounded
           corners, which would clip the accent away exactly at the corner. */
        padding: 0 4px 4px;
        box-sizing: border-box;
      }
      .tab-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        /* Shrink before scrolling: eight tabs fit a default window at ~110px
           each, so the strip only overflows once the labels would be unreadable
           anyway. min-width lets the title's ellipsis kick in. */
        flex: 0 1 auto;
        min-width: 72px;
        max-width: 200px;
        height: 24px;
        padding: 0 4px 0 10px;
        border-radius: 5px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
      }
      .tab-chip:hover {
        background: var(--btn-hover);
      }
      .tab-chip.active {
        background: var(--header-focus);
        color: var(--text);
      }
      /* A pane in this inactive tab is asking for a permission. */
      .tab-chip.attention {
        color: var(--text);
        animation: chip-attention 1s ease-in-out infinite;
      }
      @keyframes chip-attention {
        0%,
        100% {
          background: transparent;
        }
        50% {
          background: rgba(240, 190, 40, 0.4);
        }
      }
      .tab-chip-title {
        /* Fill the chip so the close button parks at the right edge even when
           the label is shorter than the chip's min-width. */
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab-chip-input {
        width: 120px;
        height: 20px;
        padding: 0 4px;
        border: 1px solid var(--accent);
        border-radius: 3px;
        background: var(--input-bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        font-size: 12px;
        outline: none;
      }
      .tab-chip-close {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 3px;
        background: transparent;
        color: var(--muted);
        font-size: 10px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
      }
      .tab-chip:hover .tab-chip-close,
      .tab-chip.active .tab-chip-close {
        opacity: 0.7;
      }
      .tab-chip-close:hover {
        background: var(--btn-hover);
        color: var(--text);
        opacity: 1;
      }
      .tab-new {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      .tab-new:hover {
        background: var(--btn-hover);
        color: var(--text);
      }
      /* Focused pane highlight. An inset outline is painted with the pane's own
         box, so the terminal canvas — a descendant — paints straight over the
         left and right edges and only the header/footer strips survive. A
         pointer-transparent overlay above the content draws the full frame. */
      .pane {
        /* a few px of gutter around every pane: the focus frame is drawn in it,
           clear of the splitters and the window edge instead of flush against
           them (where it was a hairline nobody could see) */
        padding: 3px;
      }
      .pane.focused::after,
      .pane.attention::after {
        content: '';
        position: absolute;
        inset: 1px;
        border: 1px solid var(--accent);
        border-radius: 4px;
        pointer-events: none;
        z-index: 30;
      }
      /* Zoomed pane: lifted over the rest of the layout instead of being pulled
         out of the tree, so its terminal and pty are untouched. The pane is
         opaque and covers what's underneath; the offset resolves against
         .tab-container, the nearest positioned ancestor. !important because
         .pane carries an inline position:relative. */
      .pane.zoomed {
        position: absolute !important;
        inset: 0;
        z-index: 5;
      }
      /* pending-permission highlight; cleared when the pane is focused.
         Wins over .focused via source order + !important on the color. */
      .pane.attention::after {
        border-width: 2px;
        border-color: rgba(240, 190, 40, 0.9);
        animation: pane-attention 1s ease-in-out infinite;
      }
      @keyframes pane-attention {
        0%,
        100% {
          border-color: rgba(240, 190, 40, 0.9);
        }
        50% {
          border-color: rgba(240, 190, 40, 0.35);
        }
      }
      .splitter:hover {
        background: var(--accent) !important;
      }
      .pane-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex: 0 0 26px;
        padding: 0 6px;
        background: var(--panel);
        border-bottom: 1px solid var(--header-border);
        font-family: system-ui, sans-serif;
        font-size: 11px;
        user-select: none;
      }
      .pane.focused .pane-header {
        background: var(--header-focus);
      }
      .pane-title {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pane-buttons {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .pane-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        line-height: 0;
        cursor: pointer;
      }
      /* hairline between the button groups (docs | favorites | split | window) */
      .pane-sep {
        width: 1px;
        height: 12px;
        margin: 0 3px;
        background: var(--header-border);
      }
      .pane-btn:hover {
        background: var(--btn-hover);
        color: var(--text);
      }
      .pane-btn-star-active {
        color: #e0b84a;
      }
      .pane-btn-star-active:hover {
        color: #e0b84a;
      }
      /* favorites overlay */
      .favorites-modal {
        width: min(480px, 90vw);
        max-height: 60vh;
      }
      .favorites-list {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .favorites-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .favorites-row:hover {
        background: var(--btn-hover);
      }
      .favorites-path {
        color: var(--text);
        font-family: Menlo, Monaco, monospace;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .favorites-remove {
        flex: 0 0 auto;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 5px;
        border-radius: 3px;
        opacity: 0;
        transition: opacity 0.1s;
      }
      .favorites-row:hover .favorites-remove {
        opacity: 1;
      }
      .favorites-remove:hover {
        background: var(--btn-hover);
        color: var(--error);
      }
      /* config editor modal */
      .config-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--overlay);
        z-index: 100;
        font-family: system-ui, sans-serif;
      }
      .config-modal {
        display: flex;
        flex-direction: column;
        width: min(680px, 90vw);
        max-height: 80vh;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 14px;
        gap: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .config-path {
        color: var(--muted);
        font-size: 12px;
        font-family: Menlo, Monaco, monospace;
        word-break: break-all;
      }
      .config-textarea {
        flex: 1 1 auto;
        min-height: 240px;
        resize: vertical;
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px;
        font-family: Menlo, Monaco, monospace;
        font-size: 13px;
        line-height: 1.5;
        tab-size: 2;
      }
      .config-error {
        color: var(--error);
        font-size: 12px;
        min-height: 14px;
        font-family: Menlo, Monaco, monospace;
      }
      .config-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .config-buttons button {
        padding: 6px 16px;
        border: 0;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      .config-cancel {
        background: var(--btn-hover);
        color: var(--text);
      }
      .config-save {
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }
      /* settings form */
      .settings-modal {
        gap: 8px;
      }
      .settings-title {
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .settings-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .settings-label {
        flex: 0 0 150px;
        color: var(--muted);
        font-size: 12px;
      }
      .settings-input {
        flex: 1 1 auto;
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
        font-family: Menlo, Monaco, monospace;
        font-size: 12px;
      }
      .settings-hint {
        color: var(--hint);
        font-size: 11px;
        margin-top: 2px;
      }
      .settings-checkbox {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }
      /* checkbox + the file it writes to, on one line: the path is what the row
         is really about, so it belongs next to the tickbox and not under it */
      .settings-hook-cell {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .settings-hook-file {
        color: var(--hint);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* separates the caveat from the rows it applies to */
      .settings-note {
        margin-top: 10px;
      }
      /* shortcuts cheat sheet */
      .shortcuts-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding-right: 4px;
      }
      .shortcuts-group {
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      .shortcuts-list > .shortcuts-group:first-child {
        margin-top: 0;
      }
      .shortcuts-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 3px 0;
      }
      /* Fixed key column so every label starts on the same line, which is what
         makes the sheet scannable rather than a ragged list. */
      .shortcuts-keys {
        flex: 0 0 150px;
        color: var(--text);
        font-family: Menlo, Monaco, monospace;
        font-size: 11px;
        text-align: right;
      }
      .shortcuts-label {
        flex: 1 1 auto;
        color: var(--muted);
        font-size: 12px;
      }
      /* confirm dialog */
      .confirm-modal {
        width: min(400px, 90vw);
        gap: 14px;
      }
      .confirm-message {
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
        /* dialogs that explain pass a multi-paragraph message */
        white-space: pre-line;
      }
      /* find bar — absolute inside the pane, so opening it never resizes the pty */
      .search-bar {
        position: absolute;
        top: 4px;
        right: 12px;
        /* a pane can be a third of the window wide — the bar shrinks with it
           rather than running off the left edge */
        max-width: calc(100% - 24px);
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        font-family: system-ui, sans-serif;
      }
      .search-input {
        width: 180px;
        min-width: 0;
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 6px;
        font-family: Menlo, Monaco, monospace;
        font-size: 12px;
        outline: none;
      }
      /* only inside the find bar, a row flex container: the document dropdown is
         a column, where a flex-basis would set the field's height instead */
      .search-bar .search-input {
        flex: 0 1 180px;
      }
      .search-input:focus {
        border-color: var(--accent);
      }
      .search-input.no-match {
        border-color: var(--error);
        color: var(--error);
      }
      .search-count {
        min-width: 42px;
        color: var(--muted);
        font-size: 11px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .search-toggle,
      .search-nav {
        background: transparent;
        color: var(--muted);
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 2px 5px;
        font-size: 11px;
        line-height: 1.2;
        cursor: pointer;
      }
      .search-nav {
        font-size: 13px;
      }
      .search-toggle:hover,
      .search-nav:hover {
        background: var(--btn-hover);
        color: var(--text);
      }
      .search-toggle.active {
        background: var(--header-focus);
        border-color: var(--accent);
        color: var(--text);
      }
      /* pane right-click menu */
      .context-menu {
        position: fixed;
        z-index: 100;
        min-width: 200px;
        max-width: 320px;
        padding: 4px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        font-family: system-ui, sans-serif;
      }
      .context-menu-item {
        display: block;
        width: 100%;
        padding: 6px 10px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font-size: 12px;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .context-menu-item:hover {
        background: var(--btn-hover);
      }
      .context-menu-sep {
        height: 1px;
        margin: 4px 2px;
        background: var(--border);
      }
      .confirm-danger {
        padding: 6px 16px;
        border: 0;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: var(--error);
        color: #fff;
      }

      /* ---- project docs dropdown --------------------------------------
         Anchored inside the pane body, like the find bar: a pane holding half
         the screen gets a list half the screen wide.
         Sits above .md-viewer (z-index 20) and the pane focus frame (30), so
         reopening the list over an open document brings it to the front. */
      .docs-dropdown {
        position: absolute;
        top: 4px;
        right: 12px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        width: min(420px, calc(100% - 24px));
        max-height: min(60%, 420px);
        padding: 6px;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        font-family: system-ui, sans-serif;
      }
      .docs-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .docs-root {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .docs-filter {
        width: auto;
      }
      .docs-list {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .docs-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      .docs-row.active {
        background: var(--btn-hover);
      }
      .docs-path {
        color: var(--text);
        font-family: Menlo, Monaco, monospace;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .docs-row.pinned .docs-path {
        font-weight: 600;
      }
      .docs-dir {
        color: var(--muted);
      }
      .docs-note {
        padding: 0 4px 2px;
      }

      /* ---- markdown viewer -------------------------------------------------
         Absolute over the pane body (the pane header stays visible), or fixed
         over the whole window when full-screen. Either way the pty underneath
         keeps its size and never redraws. */
      .md-viewer {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        font-family: system-ui, sans-serif;
      }
      .md-viewer.fullscreen {
        position: fixed;
        z-index: 200;
      }
      .md-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .md-title {
        color: var(--text);
        font-family: Menlo, Monaco, monospace;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .md-spacer {
        flex: 1 1 auto;
      }
      .md-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        padding: 0;
        background: transparent;
        color: var(--muted);
        border: 1px solid transparent;
        border-radius: 4px;
        line-height: 0;
        cursor: pointer;
      }
      .md-btn:hover:not(:disabled) {
        background: var(--btn-hover);
        color: var(--text);
      }
      .md-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .md-close:hover {
        color: var(--error);
      }
      .md-content {
        flex: 1 1 auto;
        overflow-y: auto;
        outline: none;
      }
      .md-body {
        max-width: 78ch;
        margin: 0 auto;
        padding: 24px 28px 64px;
        color: var(--text);
        font-size: 14px;
        line-height: 1.65;
      }
      .md-body h1,
      .md-body h2,
      .md-body h3,
      .md-body h4 {
        line-height: 1.3;
        margin: 1.6em 0 0.6em;
      }
      .md-body h1 {
        font-size: 1.7em;
      }
      .md-body h2 {
        font-size: 1.35em;
        padding-bottom: 0.2em;
        border-bottom: 1px solid var(--border);
      }
      .md-body h3 {
        font-size: 1.15em;
      }
      .md-body > :first-child {
        margin-top: 0;
      }
      .md-body a {
        color: var(--accent);
      }
      .md-body code {
        font-family: Menlo, Monaco, monospace;
        font-size: 0.88em;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .md-body pre.md-pre {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        overflow-x: auto;
      }
      .md-body pre.md-pre code {
        background: none;
        border: 0;
        padding: 0;
        font-size: 0.85em;
        line-height: 1.5;
      }
      .md-body blockquote {
        margin: 1em 0;
        padding: 0.1em 1em;
        border-left: 3px solid var(--border);
        color: var(--muted);
      }
      .md-body table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92em;
      }
      .md-body th,
      .md-body td {
        border: 1px solid var(--border);
        padding: 5px 9px;
        text-align: left;
      }
      .md-body th {
        background: var(--panel);
      }
      .md-body img {
        max-width: 100%;
      }
      /* A path that resolved to nothing (or to something outside the project):
         show the alt text as a placeholder instead of a broken-image icon. */
      .md-body img.md-img-missing {
        display: inline-block;
        min-height: 1em;
        padding: 2px 6px;
        border: 1px dashed var(--border);
        border-radius: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .md-body hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 2em 0;
      }
      .md-task {
        color: var(--muted);
        margin-right: 4px;
      }
      /* The source is the element's text until mermaid replaces it with an SVG;
         hide it in between rather than flashing the diagram's code. */
      .md-mermaid.pending {
        visibility: hidden;
      }
      .md-mermaid {
        margin: 1.2em 0;
        text-align: center;
        overflow-x: auto;
      }
      .md-mermaid svg {
        max-width: 100%;
        height: auto;
      }
      .md-mermaid-error {
        white-space: pre-wrap;
        text-align: left;
        font-family: Menlo, Monaco, monospace;
        font-size: 12px;
        color: var(--error);
        border: 1px solid var(--error);
        border-radius: 6px;
        padding: 8px 10px;
      }
      .md-error {
        color: var(--error);
        font-family: Menlo, Monaco, monospace;
        font-size: 13px;
      }
      /* find-in-document sits at the top-right of the viewer, over the content */
      .search-bar.md-find {
        top: 40px;
        /* clear of the document's scrollbar, which .md-content always shows */
        right: 22px;
        z-index: 21;
      }
      /* Painted with the CSS Custom Highlight API, so no <mark> is ever injected
         into the rendered document. */
      ::highlight(md-find) {
        background-color: rgba(255, 214, 0, 0.32);
      }
      ::highlight(md-find-active) {
        background-color: #ffd600;
        color: #1a1a1a;
      }
      /* highlight.js tokens, mapped onto the theme tokens so code follows
         light/dark instead of shipping two stylesheets. */
      .hljs-comment,
      .hljs-quote {
        color: var(--muted);
        font-style: italic;
      }
      .hljs-keyword,
      .hljs-selector-tag,
      .hljs-literal,
      .hljs-doctag,
      .hljs-name {
        color: #c678dd;
      }
      .hljs-string,
      .hljs-regexp,
      .hljs-addition,
      .hljs-attribute {
        color: var(--accent);
      }
      .hljs-number,
      .hljs-variable,
      .hljs-template-variable,
      .hljs-type,
      .hljs-built_in {
        color: #d19a66;
      }
      .hljs-title,
      .hljs-section,
      .hljs-function .hljs-title {
        color: #61afef;
      }
      .hljs-attr,
      .hljs-symbol,
      .hljs-bullet,
      .hljs-meta {
        color: #56b6c2;
      }
      .hljs-deletion {
        color: var(--error);
      }
      .hljs-emphasis {
        font-style: italic;
      }
      .hljs-strong {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
